# Render Blueprint for AccessiPath
# Deploy: backend API (Python/FastAPI) + frontend static site + PostGIS database + scheduled OSM refresh job.

databases:
  - name: accessipath-db
    databaseName: accessipath
    user: accessipath
    plan: free

services:
  # ---------- Backend API ----------
  - type: web
    name: accessipath-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: accessipath-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: OSRM_URL
        value: https://router.project-osrm.org
      - key: NOMINATIM_URL
        value: https://nominatim.openstreetmap.org
      - key: OVERPASS_URL
        value: https://overpass-api.de/api/interpreter
      - key: APP_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: VERIFICATION_CODE_TTL_MINUTES
        value: "15"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: AccessiPath <onboarding@resend.dev>

  # ---------- Frontend static site ----------
  - type: web
    name: accessipath
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_OSM_TILE_URL
        value: https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png

# ---------- Scheduled job: refresh OSM accessibility import (Render Workflows/Cron) ----------
jobs:
  - type: scheduledJob
    name: accessipath-osm-refresh
    runtime: python
    rootDir: backend
    schedule: "@daily"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/import_osm.py --update
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: accessipath-db
          property: connectionString
      - key: OVERPASS_URL
        value: https://overpass-api.de/api/interpreter